<style>
  /* RESTORED. An over-greedy regex while adding the loader matched from the
     first <style> through #hero-loading and deleted this whole block, taking
     the 500vh scroll runway with it - scrollHeight collapsed to one viewport
     and the animation had nothing to scrub against.
     getMaxScroll() measures .threejs-scroll-section, and the original Webflow
     embed carried the note "placed inside your 500vh scroll section". This
     number is the pacing control: shorter scrubs faster, longer slower. */
  html, body { margin: 0; padding: 0; background: #006622; }
  .threejs-scroll-section { position: relative; width: 100%; height: 500vh; }
</style>

<style>
  /* Recovered from the original page, rebranded. */
  #site-loader {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; will-change: transform; pointer-events: all;
  }
  #site-loader.is-exiting {
    transform: translateY(-100%);
    transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
  }
  /* Integration partners: MetaMask × KeeperHub × Ledger, as matched dark tiles
     so the mixed brand marks read as one consistent set on the black loader. */
  .loader-brands {
    display: flex; align-items: center; gap: 16px; opacity: 0;
    animation: loaderFadeIn .6s cubic-bezier(.25,.46,.45,.94) forwards .3s;
    user-select: none;
  }
  .loader-chip {
    width: 56px; height: 56px; border-radius: 15px; overflow: hidden;
    background: #0c1220; border: 1px solid rgba(255,255,255,.09);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 26px rgba(0,0,0,.45);
  }
  .loader-chip img {
    width: 60%; height: 60%; object-fit: contain; display: block;
    pointer-events: none; -webkit-user-drag: none;
  }
  .loader-chip.is-fill img { width: 100%; height: 100%; }        /* KeeperHub carries its own tile */
  .loader-chip img.is-mono { filter: brightness(0) invert(1); }   /* black glyph → white */
  .loader-x {
    color: rgba(255,255,255,.32); font-size: 15px; font-weight: 300;
    font-family: TasaOrbiter, Arial, sans-serif;
  }
  @media (max-width: 480px) {
    .loader-chip { width: 46px; height: 46px; border-radius: 12px; }
    .loader-brands { gap: 11px; }
  }
  .loader-name {
    font-family: TasaOrbiter, Arial, sans-serif; font-weight: 500;
    font-size: 13px; letter-spacing: -0.058em; color: #fff; opacity: 0;
    animation: loaderFadeIn .6s cubic-bezier(.25,.46,.45,.94) forwards .42s;
  }
  .loader-track {
    width: 200px; height: 2px; background: rgba(255,255,255,.10);
    border-radius: 2px; overflow: hidden; opacity: 0;
    animation: loaderFadeIn .6s cubic-bezier(.25,.46,.45,.94) forwards .5s;
  }
  .loader-bar {
    height: 100%; width: 0%; background: #00FF4F; border-radius: 2px;
    transition: width .12s linear; will-change: width;
  }
  @keyframes loaderFadeIn { to { opacity: 1; } }
</style>

<div id="site-loader" role="status" aria-label="Loading">
  <div class="loader-brands">
    <span class="loader-chip"><img src="/assets/brand/metamask.svg" alt="MetaMask" draggable="false"></span>
    <span class="loader-x">&#215;</span>
    <span class="loader-chip is-fill"><img src="/assets/brand/keeperhub-icon.png" alt="KeeperHub" draggable="false"></span>
    <span class="loader-x">&#215;</span>
    <span class="loader-chip"><img class="is-mono" src="/assets/brand/ledger.png" alt="Ledger" draggable="false"></span>
  </div>
  <div class="loader-name">PARALLAX</div>
  <div class="loader-track"><div class="loader-bar" id="loader-bar"></div></div>
</div>
<!--
  Razorpay Sprint '26 hero, isolated.

  The scroll runway is 500vh because getMaxScroll() measures
  .threejs-scroll-section, and the original Webflow embed carried the note
  "placed inside your 500vh scroll section". Shorten it and the animation
  scrubs faster; lengthen it and it slows down. That single number is the
  pacing control.
-->




<div id="sprint-loader" class="threejs-scroll-section"><div class="w-embed"><!--

  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  z-index: 999;
  pointer-events: none;
  transition: opacity 0.6s ease;
"></div>

<!-- Scroll Indicator (hidden for production) -->
<div id="scroll-indicator" style="display:none;"></div>

<!-- Progress Bar (hidden for production) -->
<div id="progress-bar" style="display:none;"></div>

<!-- Debug Info (hidden for production, set showDebug:true in CONFIG to re-enable) -->
<div id="debug-info" style="display:none;"></div>

<style>
  @keyframes scrollBounce {
    0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
    40% { transform: translateX(-50%) translateY(-10px); }
    60% { transform: translateX(-50%) translateY(-5px); }
  }
</style></div></div>
